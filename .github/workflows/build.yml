name: Build executables

# Manual only: official releases are built locally with KBD-Builder (they include music,
# which is not in the repository). This builds music-less executables from the source.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: DBD-Kobe-Overlay-windows
            file: dist/DBD-Kobe-Overlay.exe
          # Oldest supported Ubuntu = oldest glibc, so the binary runs on most distros
          - os: ubuntu-22.04
            artifact: DBD-Kobe-Overlay-linux
            file: dist/DBD-Kobe-Overlay
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
          pip install --no-deps -r requirements-nodeps.txt
      - name: Make icon
        run: python packaging/make_icon.py
      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/dbd_overlay.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
